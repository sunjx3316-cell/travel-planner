<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e7c66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅行智规">
  <title>旅行智规 · 智能旅游规划</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" href="/assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/app-icon.svg">
  <link rel="stylesheet" href="/css/style.css?v=1.0.1">
  <link rel="stylesheet" href="/css/rail.css?v=1.0.1">
  <link rel="stylesheet" href="/css/mode.css?v=1.1.1">
  <script src="/assets/echarts.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">🧭 旅行智规 <span class="version">v1.1.1</span></div>
    <div class="sub">开局一张中国地图,选出你想去的地方</div>
    <button id="install-app" class="install-app" type="button" hidden>安装到桌面</button>
    <button type="button" class="badge mode-badge" id="mode-badge" aria-haspopup="dialog">加载中...</button>
  </header>

  <main>
    <section class="map-panel">
      <button id="map-back" class="map-back" style="display:none">← 返回全国</button>
      <div id="map-filters" class="map-filters" style="display:none">
        <button class="filter-chip active" data-cat="全部" onclick="setSpotFilter('全部')">全部</button>
        <button class="filter-chip" data-cat="自然" onclick="setSpotFilter('自然')"><i class="map-dot nature"></i>自然</button>
        <button class="filter-chip" data-cat="人文" onclick="setSpotFilter('人文')"><i class="map-dot culture"></i>人文</button>
        <button class="filter-chip" data-cat="综合" onclick="setSpotFilter('综合')"><i class="map-dot mixed"></i>综合</button>
      </div>
      <div id="map-layers" class="map-filters" style="display:none">
        <button class="layer-chip active" data-layer="all" onclick="setMapLayer('all')">全部</button>
        <button class="layer-chip" data-layer="spot" onclick="setMapLayer('spot')">景区</button>
        <button class="layer-chip" data-layer="food" onclick="setMapLayer('food')">美食街</button>
      </div>
      <div id="map"></div>
      <div class="map-controls" aria-label="地图视图控制">
        <button type="button" onclick="zoomMap(1.5)" aria-label="放大地图" title="放大地图">+</button>
        <button type="button" onclick="zoomMap(1 / 1.5)" aria-label="缩小地图" title="缩小地图">−</button>
        <button type="button" class="map-fit" onclick="fitMapPoints()" aria-label="查看全部标点" title="查看全部标点">⌖</button>
      </div>
      <div class="map-hint" id="map-hint">点击省份 → 进入该省地图</div>
    </section>

    <section class="side-panel">
      <nav class="tabs">
        <button data-tab="cities" class="active">🏙 城市</button>
        <button data-tab="spots">🏞 景区</button>
        <button data-tab="loops">🗺 环线</button>
        <button type="button" data-action="rail" onclick="TravelRail.open()">🚆 铁路</button>
        <button data-tab="cart">🛒 清单 <span id="cart-count" class="count">0</span></button>
        <button data-tab="plans">🗺 方案</button>
        <button data-tab="trip">📌 我的行程</button>
      </nav>
      <div id="planning-progress" role="status" class="planning-progress" hidden></div>

      <div id="tab-cities" class="tab-pane active"></div>
      <div id="tab-spots" class="tab-pane"></div>
      <div id="tab-loops" class="tab-pane"></div>
      <div id="tab-cart" class="tab-pane"></div>
      <div id="tab-plans" class="tab-pane"></div>
      <div id="tab-trip" class="tab-pane"></div>
    </section>
  </main>

  <footer>
    数据来源:本地种子数据与高德 POI；评价与图片仅接入已授权或用户提交的内容，并标注来源与更新时间。
    本项目仅用于个人学习演示。
  </footer>

  <!-- 版本参数让已安装 PWA 的旧脚本缓存失效，确保逻辑更新立即生效。 -->
  <script src="/js/mode.js?v=1.1.1"></script>
  <script src="/js/app.js?v=1.1.1"></script>
  <script src="/js/workshop.js?v=1.0.1"></script>
  <script src="/js/rail.js?v=1.0.1"></script>
</body>
</html>
